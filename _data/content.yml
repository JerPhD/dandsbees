email: "dandshoney@gmail.com"
honey:
  intro: "From hives across San Francisco. Every harvest tastes a little different, like the season it came from."
  order: "Email to order"
  pickup: "Local pickup in San Francisco"
swarms:
  paragraph: "He is on the San Francisco Beekeepers Association’s swarm list, answers swarm calls from the public, and removes hives from homes & structures."
  removal: "Need a swarm removed? Moving them costs less than extermination, and the bees get to live."
events:
  visits: "Dan does school visits and classes; he brings the bees to schools, preschool through high school."
  classes: "Beekeeping classes for adults at Garden for the Environment, Alemany Farm & through the San Francisco Beekeepers Association."
  ask: "Ask about a visit or class"
about:
  story: "Dan's first hive was a swarm he re-homed. Today his bees live on a neighbor's rooftop, at the Park Street Community Garden and at Alemany Farm, where he serves on the steering committee."
  photo_1: "Opening a hive at an event"
  photo_2: "Dan & his dogs"
